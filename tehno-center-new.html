<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ТЕХНО-ЦЕНТР</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f6f8;color:#15191f}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
header{background:#11161c;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:20}
.header{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:21px;font-weight:900}.small{font-size:13px;color:#7a858f}
header .small{color:#aeb7c1}
.container{max-width:1150px;margin:auto;padding:18px}
.hero{background:linear-gradient(135deg,#111820,#293541);color:#fff;border-radius:20px;padding:30px;margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:40px}.hero p{color:#ccd4dc}
.red{background:#e43131;color:#fff}.blue{background:#246fe8;color:#fff}.white{background:#fff;color:#111;border:1px solid #dfe4e9}
.box{background:#fff;border:1px solid #e0e4e9;border-radius:16px;padding:17px;margin-bottom:17px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.filters input{flex:1;min-width:200px}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fff;border:1px solid #e0e4e9;border-radius:15px;overflow:hidden}
.photo{height:190px;background:#e9edf1;display:flex;justify-content:center;align-items:center;font-size:55px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.cardbody{padding:14px}.price{font-size:21px;font-weight:900;margin:7px 0}
.available{color:#148454;font-size:14px}.unavailable{color:#c52c2c;font-size:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d5dbe1;border-radius:9px;background:#fff}
textarea{min-height:90px;resize:vertical}
label{display:block;margin:10px 0 5px;font-size:14px;font-weight:600}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;justify-content:center;align-items:center;padding:15px}
.modal.show{display:flex}.modalbox{background:#fff;border-radius:17px;width:min(540px,100%);max-height:92vh;overflow:auto;padding:20px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.admin{display:none}.admin-grid{display:grid;grid-template-columns:190px 1fr;gap:15px}
.sidebar{background:#fff;border:1px solid #ddd;border-radius:14px;padding:8px;height:max-content}
.sidebar button{display:block;width:100%;background:#fff;text-align:left;margin-bottom:3px}
.sidebar button:hover{background:#eef2f6}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e4e7ea;text-align:left;vertical-align:top}
.table-wrap{overflow:auto}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111820;color:#fff;padding:12px 17px;border-radius:9px;display:none;z-index:100;max-width:92%;text-align:center}
.preview{width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:#f1f3f5;margin-top:8px}
.order-card{border:1px solid #ddd;border-radius:13px;padding:14px;margin-top:10px}
.status{display:inline-block;padding:5px 8px;border-radius:7px;background:#eef2f6;font-weight:700}
@media(max-width:800px){.products{grid-template-columns:repeat(2,1fr)}.admin-grid{grid-template-columns:1fr}}
@media(max-width:500px){.products{grid-template-columns:1fr}.hero h1{font-size:31px}.container{padding:12px}.hero{padding:22px}.headerAddress{display:none}}
</style>
</head>
<body>

<header id="header">
  <div class="header">
    <div>
      <div class="logo">ТЕХНО-ЦЕНТР</div>
      <div class="small" id="headerAddress">м. Сокиряни · вул. Грушевського, 7</div>
    </div>
    <button class="blue" onclick="openAdminLogin()">Адмінка</button>
  </div>
</header>

<main id="shop" class="container">
  <section class="hero">
    <h1>ТЕХНО-ЦЕНТР</h1>
    <p>Знайдете дешевше — продамо ще дешевше</p>
    <button class="red" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">Переглянути товари</button>
    <button class="white" onclick="callShop()">📞 Зателефонувати</button>
  </section>

  <section class="box">
    <h3>Категорії</h3>
    <div id="categories"></div>
  </section>

  <section id="catalog" class="box">
    <div class="filters">
      <input id="search" placeholder="🔎 Пошук товару..." oninput="renderProducts()">
      <button class="white" onclick="sortProducts('az')">А → Я</button>
      <button class="white" onclick="sortProducts('za')">Я → А</button>
      <button class="white" onclick="sortProducts('low')">Ціна ↑</button>
      <button class="white" onclick="sortProducts('high')">Ціна ↓</button>
      <button class="white" onclick="loadEverything()">Оновити</button>
    </div>
    <div id="products" class="products">Завантаження...</div>
  </section>

  <section class="box">
    <h3>Контакти</h3>
    <p>📞 <span id="phoneText">+380 98 555 34 49</span></p>
    <p>📍 <span id="addressText">м. Сокиряни, вул. Грушевського, 7</span></p>
    <p>📷 <a id="instagramLink" href="https://instagram.com/tehno_centr_sk" target="_blank" rel="noopener">@tehno_centr_sk</a></p>
  </section>
</main>

<main id="admin" class="container admin">
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2>Кабінет адміністратора</h2><button class="red" onclick="logout()">Вийти</button>
    </div>
  </div>
  <div class="admin-grid">
    <div class="sidebar">
      <button onclick="adminProducts()">📦 Товари</button>
      <button onclick="adminOrders()">🛒 Замовлення</button>
      <button onclick="adminDelivery()">🚚 Доставка</button>
      <button onclick="adminSettings()">⚙️ Магазин</button>
    </div>
    <div id="adminContent"></div>
  </div>
</main>

<div id="modal" class="modal"><div id="modalBox" class="modalbox"></div></div>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL="https://ijxnkhmhldsjcifzeqct.supabase.co";
const SUPABASE_KEY="sb_publishable_9vN58G7T0t8rZHQa-8vlPA_ziyf2XpQ";

let products=[],delivery=[],settings=null,sortMode="";

async function api(path,options={}){
  const headers={
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json",
    ...(options.headers||{})
  };
  const response=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...options,headers});
  const text=await response.text();
  if(!response.ok) throw new Error(text||("HTTP "+response.status));
  return text?JSON.parse(text):null;
}

async function storageUpload(file){
  if(!file) return "";
  if(!file.type.startsWith("image/")) throw new Error("Оберіть файл зображення");
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  const safe=["jpg","jpeg","png","webp"].includes(ext)?ext:"jpg";
  const path="public/"+Date.now()+"_"+Math.random().toString(36).slice(2,9)+"."+safe;
  const r=await fetch(SUPABASE_URL+"/storage/v1/object/product-images/"+path,{
    method:"POST",
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":file.type||"image/jpeg",
      "x-upsert":"false"
    },
    body:file
  });
  const text=await r.text();
  if(!r.ok) throw new Error(text||"Помилка завантаження фото");
  return SUPABASE_URL+"/storage/v1/object/public/product-images/"+path;
}

function escapeHtml(v){
  return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function money(v){return Number(v||0).toLocaleString("uk-UA")+" грн"}
function toast(text){
  const t=document.getElementById("toast");t.textContent=text;t.style.display="block";
  clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",3000);
}

async function loadEverything(){
  try{
    products=await api("products?select=*&order=name.asc");
    delivery=await api("delivery_zones?select=*&active=eq.true&order=city.asc");
    const s=await api("store_settings?select=*&id=eq.1");
    settings=s&&s[0]?s[0]:null;
    applySettings();renderCategories();renderProducts();
  }catch(e){
    console.error(e);
    document.getElementById("products").innerHTML="<p>Не вдалося завантажити товари.</p>";
    toast("Помилка підключення до бази");
  }
}
function applySettings(){
  if(!settings)return;
  document.getElementById("headerAddress").textContent=settings.address||"";
  document.getElementById("phoneText").textContent=settings.phone||"";
  document.getElementById("addressText").textContent=settings.address||"";
  const a=document.getElementById("instagramLink");
  a.textContent="@"+(settings.instagram||"");
  a.href="https://instagram.com/"+(settings.instagram||"");
}
function renderCategories(){
  const box=document.getElementById("categories"),cats=["Усі",...new Set(products.map(p=>p.category).filter(Boolean))];
  box.innerHTML="";
  cats.forEach(cat=>{
    const b=document.createElement("button");b.className="white";b.style.margin="4px";b.textContent=cat;
    b.onclick=()=>{document.getElementById("search").value=cat==="Усі"?"":cat;renderProducts()};box.appendChild(b);
  });
}
function renderProducts(){
  let list=[...products],q=document.getElementById("search").value.toLowerCase().trim();
  if(q)list=list.filter(p=>(p.name||"").toLowerCase().includes(q)||(p.category||"").toLowerCase().includes(q));
  if(sortMode==="az")list.sort((a,b)=>(a.name||"").localeCompare(b.name||"","uk"));
  if(sortMode==="za")list.sort((a,b)=>(b.name||"").localeCompare(a.name||"","uk"));
  if(sortMode==="low")list.sort((a,b)=>Number(a.price)-Number(b.price));
  if(sortMode==="high")list.sort((a,b)=>Number(b.price)-Number(a.price));
  const box=document.getElementById("products");
  if(!list.length){box.innerHTML="<p>Товарів поки немає.</p>";return}
  box.innerHTML=list.map(p=>`
    <article class="card">
      <div class="photo">${p.image_url?`<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}">`:"📦"}</div>
      <div class="cardbody">
        <b>${escapeHtml(p.name)}</b>
        <div class="small">${escapeHtml(p.category||"")}</div>
        <div class="price">${money(p.price)}</div>
        <div class="${p.available?"available":"unavailable"}">${p.available?"🟢 В наявності":"🔴 Немає в наявності"}</div>
        <p>${escapeHtml(p.description||"")}</p>
        ${p.available?`<button class="red" style="width:100%" onclick="openOrder('${escapeHtml(p.id)}')">Замовити</button>`:""}
      </div>
    </article>`).join("");
}
function sortProducts(m){sortMode=m;renderProducts()}

function openOrder(id){
  const p=products.find(x=>String(x.id)===String(id));if(!p)return;
  document.getElementById("modalBox").innerHTML=`
    <h2>Замовлення</h2><p><b>${escapeHtml(p.name)}</b> — ${money(p.price)}</p>
    <label>Імʼя</label><input id="orderName">
    <label>Телефон *</label><input id="orderPhone" placeholder="+380...">
    <label>Населений пункт *</label>
    <select id="orderCity"><option value="">Оберіть населений пункт</option>
      ${delivery.map(d=>`<option value="${escapeHtml(d.city)}" data-price="${Number(d.delivery_price||0)}">${escapeHtml(d.city)} — ${money(d.delivery_price)}</option>`).join("")}
    </select>
    <label>Адреса доставки *</label><input id="orderAddress" placeholder="Вулиця, будинок, квартира...">
    <label>Коментар</label><textarea id="orderComment"></textarea>
    <div id="deliveryInfo" style="margin:12px 0;font-weight:700"></div>
    <div class="modal-actions"><button class="blue" onclick="sendOrder('${escapeHtml(p.id)}')">Підтвердити замовлення</button><button class="white" onclick="closeModal()">Скасувати</button></div>`;
  document.getElementById("orderCity").addEventListener("change",updateDelivery);
  document.getElementById("modal").classList.add("show");
}
function updateDelivery(){
  const s=document.getElementById("orderCity"),o=s.options[s.selectedIndex],p=o.getAttribute("data-price");
  document.getElementById("deliveryInfo").textContent=p?"🚚 Доставка: "+money(p):"";
}
async function sendOrder(id){
  const p=products.find(x=>String(x.id)===String(id));if(!p)return;
  const name=document.getElementById("orderName").value.trim()||"Покупець";
  const phone=document.getElementById("orderPhone").value.trim();
  const city=document.getElementById("orderCity").value;
  const address=document.getElementById("orderAddress").value.trim();
  const comment=document.getElementById("orderComment").value.trim();
  if(!phone)return toast("Вкажіть номер телефону");
  if(!city)return toast("Оберіть населений пункт");
  if(!address)return toast("Вкажіть адресу доставки");
  const zone=delivery.find(d=>d.city===city),dp=Number(zone?.delivery_price||0),pp=Number(p.price||0);
  const order={customer_name:name,customer_phone:phone,city,address,delivery_price:dp,products_total:pp,total_price:pp+dp,items:[{product_id:p.id,name:p.name,price:pp,quantity:1}],comment,status:"new"};
  try{
    await api("orders",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify(order)});
    closeModal();toast("Замовлення прийнято. Дякуємо!");
  }catch(e){console.error(e);toast("Не вдалося створити замовлення");}
}

const ADMIN_LOGIN="EINSTEIN",ADMIN_PASSWORD="zax228xx";
function openAdminLogin(){
  document.getElementById("modalBox").innerHTML=`<h2>Вхід в адмін-панель</h2><label>Логін</label><input id="adminLogin"><label>Пароль</label><input id="adminPassword" type="password"><div class="modal-actions"><button class="blue" onclick="adminLogin()">Увійти</button><button class="white" onclick="closeModal()">Скасувати</button></div>`;
  document.getElementById("modal").classList.add("show");
}
function adminLogin(){
  if(document.getElementById("adminLogin").value===ADMIN_LOGIN&&document.getElementById("adminPassword").value===ADMIN_PASSWORD){
    closeModal();document.getElementById("shop").style.display="none";document.getElementById("header").style.display="none";document.getElementById("admin").style.display="block";adminProducts();
  }else toast("Невірний логін або пароль");
}
function logout(){document.getElementById("admin").style.display="none";document.getElementById("header").style.display="block";document.getElementById("shop").style.display="block"}

function adminProducts(){
  document.getElementById("adminContent").innerHTML=`
  <div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Товари</h2><button class="blue" onclick="productForm()">+ Додати товар</button></div>
  <div class="table-wrap"><table><thead><tr><th>Назва</th><th>Ціна</th><th>Наявність</th><th>Дії</th></tr></thead><tbody>
  ${products.map(p=>`<tr><td>${escapeHtml(p.name)}</td><td>${money(p.price)}</td><td>${p.available?"🟢":"🔴"}</td><td><button onclick="productForm('${escapeHtml(p.id)}')">✏️</button> <button onclick="deleteProduct('${escapeHtml(p.id)}')">🗑️</button></td></tr>`).join("")}
  </tbody></table></div></div>`;
}
function productForm(id=null){
  const p=id?products.find(x=>String(x.id)===String(id)):{name:"",description:"",price:"",image_url:"",category:"",available:true};
  document.getElementById("modalBox").innerHTML=`
    <h2>${id?"Редагувати товар":"Новий товар"}</h2>
    <label>Назва товару *</label><input id="pName" value="${escapeHtml(p.name)}">
    <label>Категорія</label><input id="pCategory" value="${escapeHtml(p.category||"")}">
    <label>Ціна, грн *</label><input id="pPrice" type="number" min="0" step="0.01" value="${p.price}">
    <label>Фото товару</label><input id="pImageFile" type="file" accept="image/jpeg,image/png,image/webp">
    ${p.image_url?`<img class="preview" src="${escapeHtml(p.image_url)}" alt="Поточне фото">`:""}
    <input id="pImage" type="hidden" value="${escapeHtml(p.image_url||"")}">
    <label>Опис</label><textarea id="pDescription">${escapeHtml(p.description||"")}</textarea>
    <label><input id="pAvailable" type="checkbox" ${p.available?"checked":""} style="width:auto"> В наявності</label>
    <div class="modal-actions"><button class="blue" id="saveProductBtn" onclick="saveProduct('${id?escapeHtml(id):""}')">Зберегти</button><button class="white" onclick="closeModal()">Скасувати</button></div>`;
  document.getElementById("modal").classList.add("show");
}
async function saveProduct(id){
  const btn=document.getElementById("saveProductBtn"),file=document.getElementById("pImageFile").files[0];
  const data={name:document.getElementById("pName").value.trim(),category:document.getElementById("pCategory").value.trim(),price:Number(document.getElementById("pPrice").value),image_url:document.getElementById("pImage").value.trim(),description:document.getElementById("pDescription").value.trim(),available:document.getElementById("pAvailable").checked};
  if(!data.name||!data.price)return toast("Заповніть назву та ціну");
  btn.disabled=true;btn.textContent=file?"Завантаження фото...":"Збереження...";
  try{
    if(file)data.image_url=await storageUpload(file);
    await api(id?"products?id=eq."+encodeURIComponent(id):"products",{method:id?"PATCH":"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify(data)});
    closeModal();await loadEverything();adminProducts();toast("Товар збережено");
  }catch(e){console.error(e);toast("Помилка збереження: "+String(e.message||e).slice(0,160));}
  finally{btn.disabled=false}
}
async function deleteProduct(id){
  if(!confirm("Видалити цей товар?"))return;
  try{await api("products?id=eq."+encodeURIComponent(id),{method:"DELETE"});await loadEverything();adminProducts();toast("Товар видалено")}catch(e){toast("Помилка видалення")}
}

async function adminOrders(){
  try{
    const orders=await api("orders?select=*&order=created_at.desc");
    document.getElementById("adminContent").innerHTML=`<div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Замовлення</h2><button class="white" onclick="adminOrders()">Оновити</button></div>
    ${!orders.length?"<p>Замовлень поки немає.</p>":orders.map(o=>`
      <div class="order-card"><b>Замовлення №${escapeHtml(o.order_number||o.id)}</b>
      <p>👤 ${escapeHtml(o.customer_name)}</p><p>📞 ${escapeHtml(o.customer_phone)}</p><p>📍 ${escapeHtml(o.city)}, ${escapeHtml(o.address)}</p>
      <p>💰 ${money(o.total_price)} &nbsp; 🚚 ${money(o.delivery_price)}</p>
      <p>Статус: <span class="status">${escapeHtml(o.status||"new")}</span></p>
      ${o.comment?`<p>💬 ${escapeHtml(o.comment)}</p>`:""}
      <button class="blue" onclick="changeOrderStatus('${escapeHtml(o.id)}','confirmed')">Підтвердити</button>
      <button class="red" onclick="changeOrderStatus('${escapeHtml(o.id)}','cancelled')">Скасувати</button></div>`).join("")}</div>`;
  }catch(e){console.error(e);document.getElementById("adminContent").innerHTML=`<div class="box"><h2>Замовлення</h2><p>Не вдалося завантажити замовлення.</p><p class="small">${escapeHtml(String(e.message||e))}</p></div>`}
}
async function changeOrderStatus(id,status){
  try{await api("orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({status})});adminOrders()}catch(e){toast("Помилка зміни статусу")}
}

function adminDelivery(){
  document.getElementById("adminContent").innerHTML=`<div class="box"><h2>🚚 Доставка</h2><p class="small">Покупець вибирає населений пункт зі списку.</p>
  <div>${delivery.map(d=>`<div class="box"><b>${escapeHtml(d.city)}</b> — ${money(d.delivery_price)} <button onclick="deleteDelivery('${escapeHtml(d.id)}')">🗑️</button></div>`).join("")}</div>
  <h3>Додати населений пункт</h3><label>Назва</label><input id="newCity"><label>Ціна доставки, грн</label><input id="newDeliveryPrice" type="number"><div class="modal-actions"><button class="blue" onclick="addDelivery()">Додати</button></div></div>`;
}
async function addDelivery(){
  const city=document.getElementById("newCity").value.trim(),price=Number(document.getElementById("newDeliveryPrice").value);
  if(!city||!price)return toast("Заповніть дані");
  try{await api("delivery_zones",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({city,delivery_price:price,active:true})});delivery=await api("delivery_zones?select=*&active=eq.true&order=city.asc");adminDelivery();toast("Населений пункт додано")}catch(e){toast("Помилка додавання")}
}
async function deleteDelivery(id){
  if(!confirm("Видалити населений пункт?"))return;
  try{await api("delivery_zones?id=eq."+encodeURIComponent(id),{method:"DELETE"});delivery=await api("delivery_zones?select=*&active=eq.true&order=city.asc");adminDelivery()}catch(e){toast("Помилка видалення")}
}

function adminSettings(){
  if(!settings)return toast("Налаштування ще не завантажені");
  document.getElementById("adminContent").innerHTML=`<div class="box"><h2>⚙️ Магазин</h2>
  <label>Назва магазину</label><input id="setName" value="${escapeHtml(settings.store_name||"")}">
  <label>Телефон</label><input id="setPhone" value="${escapeHtml(settings.phone||"")}">
  <label>Instagram</label><input id="setInstagram" value="${escapeHtml(settings.instagram||"")}">
  <label>Адреса</label><input id="setAddress" value="${escapeHtml(settings.address||"")}">
  <label>Опис</label><textarea id="setDescription">${escapeHtml(settings.description||"")}</textarea>
  <div class="modal-actions"><button class="blue" onclick="saveSettings()">Зберегти</button></div></div>`;
}
async function saveSettings(){
