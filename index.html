<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТЕХНО-ЦЕНТР</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:10;background:#0b0f15ee;backdrop-filter:blur(12px);border-bottom:1px solid #27303b;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.wrap{max-width:1100px;margin:auto;padding:18px}.hero,.box,.card{background:#111720;border:1px solid #27303b;border-radius:18px}.hero{padding:25px;margin-bottom:16px}.hero h1{font-size:38px;margin:0 0 6px}.muted{color:#9ba6b5}.btn,.tab{border:0;border-radius:10px;padding:10px 14px;color:white;background:#2878ff;font-weight:700;cursor:pointer}.dark{background:#151d28;border:1px solid #303b49}.red{background:#d83c43}.nav{display:flex;gap:8px;overflow:auto;margin:10px 0 16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{overflow:hidden}.pic{height:160px;background:#182230;display:grid;place-items:center;font-size:48px}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.price{font-size:19px;font-weight:900;margin:6px 0}.green{color:#29c487}.yellow{color:#efbb4c}.admin{display:none}.layout{display:grid;grid-template-columns:210px 1fr;gap:15px}.side{background:#111720;border:1px solid #27303b;border-radius:16px;padding:8px;height:max-content}.side button{display:block;width:100%;text-align:left;background:transparent;color:#9ba6b5;border:0;padding:11px;border-radius:9px;cursor:pointer}.side button.active{background:#192230;color:white}.field{margin:10px 0}.field label{display:block;font-size:13px;color:#9ba6b5;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#090d13;color:#fff;border:1px solid #303a47;border-radius:9px;padding:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #27303b;text-align:left}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{background:#111720;border:1px solid #303a47;border-radius:18px;padding:18px;width:min(560px,100%);max-height:92vh;overflow:auto}.toast{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#182338;border:1px solid #415576;padding:11px 16px;border-radius:10px;z-index:30}.empty{text-align:center;padding:30px;color:#9ba6b5}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#111720;border:1px solid #293442;border-radius:20px;padding:24px}.logout{background:#45181b;border:1px solid #6b282d}
@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{white-space:nowrap;min-width:max-content}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:30px}.row{grid-template-columns:1fr}}
</style>
</head><body>

<div id="loginPage" class="login"><div class="loginbox">
<h1>ТЕХНО-ЦЕНТР</h1><p class="muted">Вхід до адміністративної панелі</p>
<div id="loginError" class="empty" style="display:none;color:#ff8d93">Невірний логін або пароль</div>
<div class="field"><label>Логін</label><input id="loginUser" autocomplete="username"></div>
<div class="field"><label>Пароль</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
<button class="btn" style="width:100%" onclick="login()">Увійти</button>
<button class="tab dark" style="width:100%;margin-top:8px" onclick="openSite()">Переглянути сайт</button>
</div></div>

<header id="siteHeader" class="top" style="display:none"><div class="brand" id="brand"></div><button class="btn dark" onclick="openAdminLogin()">Адмінка</button></header>

<main id="site" class="wrap" style="display:none">
<div class="hero"><h1 id="name"></h1><div class="muted" id="slogan"></div></div>
<div id="cats" class="nav"></div>
<section class="box" style="padding:15px;margin-bottom:15px"><h2>🔥 Акції</h2><div id="sales" class="grid"></div></section>
<section id="catalog" class="box" style="padding:15px"><h2>Товари</h2><div class="nav"><button class="tab dark" onclick="showAll()">Усі</button><button class="tab dark" onclick="sortP('az')">А → Я</button><button class="tab dark" onclick="sortP('za')">Я → А</button><button class="tab dark" onclick="sortP('lo')">Ціна ↑</button><button class="tab dark" onclick="sortP('hi')">Ціна ↓</button></div><div id="products" class="grid"></div></section>
<section class="box" style="padding:15px;margin-top:15px"><h2>Контакти</h2><p id="about" class="muted"></p><p>📞 <b id="phone"></b></p><p>📍 <span id="address"></span></p><p>🕐 <span id="hours"></span></p><p>📷 <span id="insta"></span></p></section>
</main>

<main id="admin" class="wrap admin"><div class="top" style="position:static;margin:-18px -18px 18px"><b>ТЕХНО-ЦЕНТР · Адмін-панель</b><button class="btn logout" onclick="logout()">Вийти</button></div><div class="layout"><aside class="side" id="menu"></aside><section id="panel"></section></div></main>
<div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><div id="toast" class="toast"></div>

<script>
const AUTH_USER="EINSTEIN", AUTH_PASS="zax228xx", KEY="TECHNO_CENTER_FINAL_V1";
const initial={shop:{name:"ТЕХНО-ЦЕНТР",slogan:"Знайдете дешевше — продамо ще дешевше",phone:"+380 XX XXX XX XX",address:"Адреса магазину",hours:"Пн–Пт 08:30–18:00 · Сб 09:00–17:00 · Нд 10:00–14:00",instagram:"@techno_center",about:"Побутова техніка, товари для дому та інші послуги."},cats:["Холодильники","Телевізори","Пральні машини","Техніка для дому"],products:[],orders:[],delivery:[]};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||initial, visibleList=[...db.products], tmpImage="";
const $=x=>document.getElementById(x);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function msg(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1600)}
function login(){if($("loginUser").value===AUTH_USER&&$("loginPassword").value===AUTH_PASS){sessionStorage.setItem("admin","1");showAdmin()}else $("loginError").style.display="block"}
function openAdminLogin(){$("site").style.display="none";$("siteHeader").style.display="none";$("loginPage").style.display="grid"}
function openSite(){$("loginPage").style.display="none";$("admin").style.display="none";$("siteHeader").style.display="flex";$("site").style.display="block";renderSite();scrollTo(0,0)}
function showAdmin(){$("loginPage").style.display="none";$("siteHeader").style.display="none";$("site").style.display="none";$("admin").style.display="block";menu();panel("dash")}
function logout(){sessionStorage.removeItem("admin");openSite()}
function renderSite(){brand.textContent=db.shop.name;name.textContent=db.shop.name;slogan.textContent=db.shop.slogan;phone.textContent=db.shop.phone;address.textContent=db.shop.address;hours.textContent=db.shop.hours;insta.textContent=db.shop.instagram;about.textContent=db.shop.about;cats.innerHTML=db.cats.map(c=>`<button class="tab dark" onclick="cat('${esc(c)}')">${esc(c)}</button>`).join("");sales.innerHTML=db.products.filter(p=>p.visible&&p.sale).map(card).join("")||'<div class="empty">Акцій поки немає</div>';products.innerHTML=visibleList.filter(p=>p.visible).map(card).join("")||'<div class="empty">Товарів поки немає. Відкрийте Адмінку та додайте перший товар.</div>'}
const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function card(p){return `<article class="card"><div class="pic">${p.image?`<img src="${p.image}">`:"📦"}</div><div class="body"><b>${esc(p.name)}</b><div class="muted">${esc(p.category)}${p.brand?" · "+esc(p.brand):""}</div><div class="price">${Number(p.price).toLocaleString("uk-UA")} грн</div><div class="${p.stock?"green":""}">${p.stock?"🟢 В наявності":"🔴 Немає в наявності"}</div>${p.sale?'<div class="yellow">🔥 АКЦІЯ</div>':""}<div class="muted">${esc(p.specs)}</div><button class="btn" style="width:100%;margin-top:8px" onclick="order(${p.id})">Замовити</button></div></article>`}
function showAll(){visibleList=[...db.products];renderSite()}function cat(c){visibleList=db.products.filter(p=>p.category===c);renderSite();$("catalog").scrollIntoView({behavior:"smooth"})}function sortP(t){visibleList.sort((a,b)=>t==="az"?a.name.localeCompare(b.name,"uk"):t==="za"?b.name.localeCompare(a.name,"uk"):t==="lo"?a.price-b.price:b.price-a.price);renderSite()}
function menu(){$("menu").innerHTML=[["dash","📊 Огляд"],["shop","🏪 Магазин"],["products","📦 Товари"],["orders","🛒 Замовлення"],["cats","🗂️ Категорії"],["delivery","🚚 Доставка"]].map(x=>`<button data-x="${x[0]}" onclick="panel('${x[0]}')">${x[1]}</button>`).join("")}
function active(x){document.querySelectorAll("#menu button").forEach(b=>b.classList.toggle("active",b.dataset.x===x))}
function panel(x){active(x);if(x==="dash")$("panel").innerHTML=`<div class="box" style="padding:18px"><h1>Огляд</h1><div class="row"><div class="box"><b>${db.products.length}</b><br>товарів</div><div class="box"><b>${db.orders.length}</b><br>замовлень</div></div><p class="muted">Дані зберігаються у браузері. Для реального багатокористувацького сайту потрібен сервер.</p></div>`;
if(x==="shop")$("panel").innerHTML=`<div class="box" style="padding:18px"><h1>🏪 Магазин</h1>${field("sn","Назва",db.shop.name)}${field("sp","Телефон",db.shop.phone)}${field("sa","Адреса",db.shop.address)}${field("sh","Графік",db.shop.hours)}${field("si","Instagram",db.shop.instagram)}${field("ss","Слоган",db.shop.slogan)}${area("sb","Опис",db.shop.about)}<button class="btn" onclick="saveShop()">Зберегти</button></div>`;
if(x==="products")productsPanel();if(x==="orders")ordersPanel();if(x==="cats")catsPanel();if(x==="delivery")deliveryPanel()}
function field(id,l,v,type="text"){return `<div class="field"><label>${l}</label><input id="${id}" type="${type}" value="${esc(v)}"></div>`}function area(id,l,v){return `<div class="field"><label>${l}</label><textarea id="${id}" rows="4">${esc(v)}</textarea></div>`}
function saveShop(){Object.assign(db.shop,{name:sn.value,phone:sp.value,address:sa.value,hours:sh.value,instagram:si.value,slogan:ss.value,about:sb.value});save();renderSite();msg("Збережено")}
function productsPanel(){$("panel").innerHTML=`<div class="box" style="padding:18px"><h1>📦 Товари</h1><button class="btn" onclick="productForm()">+ Додати товар</button><table class="table" style="margin-top:14px;width:100%"><tr><th>Товар</th><th>Ціна</th><th>Сайт</th><th></th></tr>${db.products.map((p,i)=>`<tr><td>${esc(p.name)}</td><td>${p.price} грн</td><td>${p.visible?"👁️":"🙈"}</td><td><button class="tab dark" onclick="productForm(${i})">✏️</button> <button class="tab dark" onclick="visibility(${i})">👁️</button> <button class="tab red" onclick="delProduct(${i})">🗑️</button></td></tr>`).join("")||'<tr><td colspan="4" class="empty">Товарів немає</td></tr>'}</table></div>`}
function productForm(i=null){let p=i==null?{name:"",brand:"",category:db.cats[0]||"",price:"",stock:true,visible:true,sale:false,specs:"",image:""}:db.products[i];tmpImage=p.image||"";$("modalbox").innerHTML=`<h2>${i==null?"Додати товар":"Редагувати товар"}</h2>${field("pn","Назва *",p.name)}${field("pb","Бренд",p.brand)}<div class="field"><label>Категорія</label><select id="pc">${db.cats.map(c=>`<option ${c===p.category?"selected":""}>${esc(c)}</option>`).join("")}</select></div>${field("pp","Ціна, грн *",p.price,"number")}${area("ps","Характеристики",p.specs)}<div class="field"><label>Фото</label><input type="file" accept="image/*" onchange="readPhoto(this)"></div><div id="preview">${p.image?`<img src="${p.image}" style="max-width:100%;max-height:180px">`:""}</div><p><label><input id="pst" type="checkbox" ${p.stock?"checked":""}> В наявності</label></p><p><label><input id="pvi" type="checkbox" ${p.visible?"checked":""}> Показувати на сайті</label></p><p><label><input id="psa" type="checkbox" ${p.sale?"checked":""}> Акція</label></p><button class="btn" onclick="saveProduct(${i==null?"null":i})">Зберегти</button> <button class="tab dark" onclick="closeModal()">Скасувати</button>`;$("modal").classList.add("show")}
function readPhoto(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{tmpImage=e.target.result;preview.innerHTML=`<img src="${tmpImage}" style="max-width:100%;max-height:180px">`};r.readAsDataURL(f)}
function saveProduct(i){if(!pn.value.trim()||!pp.value)return msg("Заповніть назву та ціну");let p={id:i==null?Date.now():db.products[i].id,name:pn.value.trim(),brand:pb.value,category:pc.value,price:Number(pp.value),specs:ps.value,stock:pst.checked,visible:pvi.checked,sale:psa.checked,image:tmpImage};if(i==null)db.products.push(p);else db.products[i]=p;save();visibleList=[...db.products];closeModal();productsPanel();renderSite();msg("Товар збережено")}
function visibility(i){db.products[i].visible=!db.products[i].visible;save();productsPanel();renderSite()}function delProduct(i){if(confirm("Видалити товар?")){db.products.splice(i,1);save();visibleList=[...db.products];productsPanel();renderSite()}}
function catsPanel(){$("panel").innerHTML=`<div class="box" style="padding:18px"><h1>🗂️ Категорії</h1>${db.cats.map((c,i)=>`<div class="field" style="display:flex;gap:8px"><input value="${esc(c)}" onchange="db.cats[${i}]=this.value;save();renderSite()"><button class="tab red" onclick="delCat(${i})">Видалити</button></div>`).join("")}${field("nc","Нова категорія","")}<button class="btn" onclick="addCat()">Додати</button></div>`}
function addCat(){let v=nc.value.trim();if(v&&!db.cats.includes(v)){db.cats.push(v);save();panel("cats");renderSite()}}function delCat(i){if(confirm("Видалити категорію?")){db.cats.splice(i,1);save();panel("cats");renderSite()}}
function ordersPanel(){$("panel").innerHTML=`<div class="box" style="padding:18px"><h1>🛒 Замовлення</h1>${db.orders.slice().reverse().map((o,j)=>`<div class="card"><b>№${o.num} — ${esc(o.product)}</b><br>${esc(o.name)} · ${esc(o.phone)}<br>${esc(o.place)} · ${esc(o.address)}<br>${o.price} грн · ${o.status}<br><select onchange="orderStatus(${db.orders.indexOf(o)},this.value)"><option>Новий</option><option>В роботі</option><option>Завершено</option></select></div>`).join("")||'<div class="empty">Замовлень немає</div>'}</div>`}
function orderStatus(i,v){db.orders[i].status=v;save()}
function deliveryPanel(){$("panel").innerHTML=`<div class="box" style="padding:18px"><h1>🚚 Доставка</h1><p class="muted">Можна додати населені пункти та вартість доставки.</p>${db.delivery.map((d,i)=>`<div class="field" style="display:flex;gap:8px"><input value="${esc(d.place)}" onchange="db.delivery[${i}].place=this.value;save()"><input type="number" value="${d.price}" onchange="db.delivery[${i}].price=Number(this.value);save()"><button class="tab red" onclick="db.delivery.splice(${i},1);save();deliveryPanel()">×</button></div>`).join("")}${field("dp","Населений пункт","")}${field("dprice","Ціна доставки","300","number")}<button class="btn" onclick="addDelivery()">Додати</button></div>`}
function addDelivery(){if(dp.value.trim()){db.delivery.push({place:dp.value.trim(),price:Number(dprice.value||0)});save();deliveryPanel()}}
function order(id){let p=db.products.find(x=>x.id===id);$("modalbox").innerHTML=`<h2>Замовлення</h2><p><b>${esc(p.name)}</b> — ${p.price} грн</p>${field("on","Імʼя","")}${field("op","Телефон *","")}${field("opl","Населений пункт *","")}${field("oa","Адреса доставки *","")}${area("oc","Коментар","")}<button class="btn" onclick="createOrder(${id})">Підтвердити замовлення</button> <button class="tab dark" onclick="closeModal()">Скасувати</button>`;$("modal").classList.add("show")}
function createOrder(id){if(!on.value.trim()||!op.value.trim()||!opl.value.trim()||!oa.value.trim())return msg("Заповніть обовʼязкові поля");let p=db.products.find(x=>x.id===id),date=new Date().toISOString().slice(0,10),num=db.orders.filter(x=>x.date===date).length+1;db.orders.push({num,date,product:p.name,price:p.price,name:on.value,phone:op.value,place:opl.value,address:oa.value,comment:oc.value,status:"Новий"});save();closeModal();msg("Замовлення №"+num+" прийнято")}
function closeModal(){$("modal").classList.remove("show")}$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()}
if(sessionStorage.getItem("admin")==="1")showAdmin();else openSite();
const SUPABASE_URL = 'https://yhraejryqqnewudzgxoa.supabaseconst SUPABASE_KEY = 'sb_publishable_ErW7J59itfI5pFcFP4B5GA_6XCmCfiT';
  const SUPABASE_KEY = 'sb_publishable_ErW7J59itfI5pFcFP4B5GA_6XCmCfiT';

/script></body></html>
