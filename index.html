<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТЕХНО-ЦЕНТР</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f6f8;color:#15191f}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.red{background:#e43131;color:#fff}.blue{background:#246fe8;color:#fff}.white{background:#fff;color:#111;border:1px solid #e0e4e9}
header{background:#11161c;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:20}.header{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font-size:22px;font-weight:900}.small{font-size:13px;color:#aeb7c1}.container{max-width:1150px;margin:auto;padding:18px}
.hero{background:linear-gradient(135deg,#111820,#293541);color:#fff;border-radius:20px;padding:30px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:40px}.hero p{color:#ccd4dc}.hero-actions{display:flex;gap:9px;flex-wrap:wrap}
.box{background:#fff;border:1px solid #e0e4e9;border-radius:16px;padding:17px;margin-bottom:17px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filters input{flex:1;min-width:200px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d5dbe1;border-radius:9px;background:#fff}label{display:block;margin:10px 0 5px;font-size:14px;font-weight:700}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e0e4e9;border-radius:15px;overflow:hidden}.photo{height:190px;background:#e9edf1;display:flex;justify-content:center;align-items:center;font-size:55px}.photo img{width:100%;height:100%;object-fit:cover}.cardbody{padding:14px}.price{font-size:21px;font-weight:900;margin:7px 0}.available{color:#148454;font-size:14px}.unavailable{color:#c52c2c;font-size:14px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;justify-content:center;align-items:center;padding:15px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:17px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px}.modal-actions{display:flex;gap:8px;margin-top:15px}.modal-actions button{flex:1}
.admin{display:none}.admin-grid{display:grid;grid-template-columns:190px 1fr;gap:15px}.sidebar{background:#fff;border:1px solid #ddd;border-radius:14px;padding:8px;height:max-content}.sidebar button{display:block;width:100%;background:#fff;text-align:left;margin-bottom:3px}.sidebar button:hover{background:#eef2f6}
.admin-card{background:#fff;border:1px solid #e0e4e9;border-radius:16px;padding:16px;margin-bottom:12px}.order-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.order-total{font-size:22px;font-weight:900}.status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#eef2f6}.status.new{background:#fff1d6;color:#996000}.status.confirmed{background:#e5f0ff;color:#1459bb}.status.done{background:#e4f7ed;color:#14734a}.status.cancelled{background:#ffe7e7;color:#ad2525}.admin-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.product-admin{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #e0e4e9}.product-admin img{width:70px;height:55px;object-fit:cover;border-radius:8px;background:#eee}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;padding:25px;color:#707981}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111820;color:#fff;padding:12px 17px;border-radius:9px;display:none;z-index:100}
@media(max-width:800px){.products{grid-template-columns:repeat(2,1fr)}.admin-grid{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}}@media(max-width:500px){.products{grid-template-columns:1fr}.hero h1{font-size:31px}.container{padding:12px}.product-admin{grid-template-columns:55px 1fr}.product-admin .admin-actions{grid-column:1/-1}.order-top{flex-direction:column}.hero{padding:23px}}
</style>
</head>
<body>
<header id="header"><div class="header"><div><div class="logo" id="headerName">ТЕХНО-ЦЕНТР</div><div class="small" id="headerAddress">м. Сокиряни · вул. Грушевського, 7</div></div><button class="blue" onclick="openAdminLogin()">Адмінка</button></div></header>

<main id="shop" class="container">
<section class="hero"><h1 id="heroName">ТЕХНО-ЦЕНТР</h1><p id="heroDescription">Знайдете дешевше — продамо ще дешевше</p><div class="hero-actions"><button class="red" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">Переглянути товари</button><button class="white" onclick="callShop()">📞 Зателефонувати</button></div></section>
<section class="box"><h3>Категорії</h3><div id="categories"></div></section>
<section id="catalog" class="box"><div class="filters"><input id="search" placeholder="🔎 Пошук товару..." oninput="renderProducts()"><button class="white" onclick="sortProducts('az')">А → Я</button><button class="white" onclick="sortProducts('za')">Я → А</button><button class="white" onclick="sortProducts('low')">Ціна ↑</button><button class="white" onclick="sortProducts('high')">Ціна ↓</button><button class="white" onclick="loadProducts()">Оновити</button></div><div id="products">Завантаження...</div></section>
<section class="box"><h3>Контакти</h3><p>📞 <span id="phoneText">+380 98 555 34 49</span></p><p>📍 <span id="addressText">м. Сокиряни, вул. Грушевського, 7</span></p><p>📷 <a id="instagramLink" href="https://instagram.com/tehno_centr_sk" target="_blank">@tehno_centr_sk</a></p></section>
</main>

<main id="admin" class="container admin"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Кабінет адміністратора</h2><button class="red" onclick="logout()">Вийти</button></div></div><div class="admin-grid"><div class="sidebar"><button onclick="adminProducts()">📦 Товари</button><button onclick="adminOrders()">🛒 Замовлення</button><button onclick="adminDelivery()">🚚 Доставка</button><button onclick="adminSettings()">⚙️ Магазин</button></div><div id="adminContent"></div></div></main>

<div id="modal" class="modal"><div id="modalBox" class="modalbox"></div></div><div id="toast" class="toast"></div>

<script>
const SUPABASE_URL="https://ijxnkhmhldsjcifzeqct.supabase.co";
const SUPABASE_KEY="sb_publishable_9vN58G7T0t8rZHQa-8vlPA_ziyf2XpQ";

async function api(table,options={}){
 const response=await fetch(SUPABASE_URL+"/rest/v1/"+table,{...options,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",...(options.headers||{})}});
 if(!response.ok){const text=await response.text();throw new Error(text||"Помилка Supabase")}
 const text=await response.text();return text?JSON.parse(text):null;
}
let products=[],delivery=[],settings=null,sortMode="";

async function loadEverything(){try{products=await api("products?select=*&order=name.asc");delivery=await api("delivery_zones?select=*&active=eq.true&order=city.asc");const s=await api("store_settings?select=*&id=eq.1");settings=s[0]||null;applySettings();renderCategories();renderProducts()}catch(e){console.error(e);document.getElementById("products").innerHTML='<div class="empty">Не вдалося завантажити товари.</div>';toast("Помилка підключення до бази")}}
function applySettings(){if(!settings)return;const n=settings.store_name||"ТЕХНО-ЦЕНТР",a=settings.address||"";document.getElementById("headerName").textContent=n;document.getElementById("heroName").textContent=n;document.getElementById("heroDescription").textContent=settings.description||"Знайдете дешевше — продамо ще дешевше";document.getElementById("headerAddress").textContent=a;document.getElementById("phoneText").textContent=settings.phone||"";document.getElementById("addressText").textContent=a;const ig=(settings.instagram||"").replace(/^@/,"");document.getElementById("instagramLink").textContent=ig?"@"+ig:"Instagram";document.getElementById("instagramLink").href=ig?"https://instagram.com/"+ig:"#"}
function renderCategories(){const b=document.getElementById("categories"),c=["Усі",...new Set(products.map(p=>p.category).filter(Boolean))];b.innerHTML="";c.forEach(x=>{const q=document.createElement("button");q.className="white";q.style.margin="4px";q.textContent=x;q.onclick=()=>{document.getElementById("search").value=x==="Усі"?"":x;renderProducts()};b.appendChild(q)})}
function renderProducts(){let l=[...products],s=document.getElementById("search").value.toLowerCase().trim();if(s)l=l.filter(p=>(p.name||"").toLowerCase().includes(s)||(p.category||"").toLowerCase().includes(s));if(sortMode==="az")l.sort((a,b)=>a.name.localeCompare(b.name,"uk"));if(sortMode==="za")l.sort((a,b)=>b.name.localeCompare(a.name,"uk"));if(sortMode==="low")l.sort((a,b)=>Number(a.price)-Number(b.price));if(sortMode==="high")l.sort((a,b)=>Number(b.price)-Number(a.price));const b=document.getElementById("products");if(!l.length){b.className="";b.innerHTML='<div class="empty">Товарів поки немає.</div>';return}b.className="products";b.innerHTML=l.map(p=>`<article class="card"><div class="photo">${p.image_url?`<img src="${escapeHtml(p.image_url)}" alt="">`:"📦"}</div><div class="cardbody"><b>${escapeHtml(p.name)}</b><div class="small">${escapeHtml(p.category||"")}</div><div class="price">${Number(p.price).toLocaleString("uk-UA")} грн</div><div class="${p.available?"available":"unavailable"}">${p.available?"🟢 В наявності":"🔴 Немає в наявності"}</div>${p.description?`<p>${escapeHtml(p.description)}</p>`:""}${p.available?`<button class="red" style="width:100%" onclick="openOrder('${p.id}')">Замовити</button>`:""}</div></article>`).join("")}
function sortProducts(m){sortMode=m;renderProducts()}

function openOrder(id){const p=products.find(x=>x.id===id);if(!p)return;document.getElementById("modalBox").innerHTML=`<h2>Замовлення</h2><div class="box"><b>${escapeHtml(p.name)}</b><div class="price">${Number(p.price).toLocaleString("uk-UA")} грн</div></div><label>Імʼя</label><input id="orderName"><label>Телефон *</label><input id="orderPhone" placeholder="+380..."><label>Населений пункт *</label><select id="orderCity"><option value="">Оберіть населений пункт</option>${delivery.map(d=>`<option value="${escapeHtml(d.city)}" data-price="${d.delivery_price}">${escapeHtml(d.city)} — ${Number(d.delivery_price).toLocaleString("uk-UA")} грн</option>`).join("")}<option value="__none__">Немає мого населеного пункту</option></select><label>Адреса доставки *</label><input id="orderAddress" placeholder="Вулиця, будинок, квартира..."><label>Коментар</label><textarea id="orderComment"></textarea><div id="deliveryInfo" style="margin:12px 0;font-weight:800"></div><div class="modal-actions"><button class="blue" onclick="sendOrder('${p.id}')">Підтвердити замовлення</button><button class="white" onclick="closeModal()">Скасувати</button></div>`;document.getElementById("orderCity").addEventListener("change",updateDelivery);document.getElementById("modal").classList.add("show")}
function updateDelivery(){const s=document.getElementById("orderCity"),o=s.options[s.selectedIndex],p=o.getAttribute("data-price");document.getElementById("deliveryInfo").textContent=s.value==="__none__"?"🚚 Доставка для цього населеного пункту поки не налаштована.":p?"🚚 Доставка: "+Number(p).toLocaleString("uk-UA")+" грн":""}
async function sendOrder(id){const p=products.find(x=>x.id===id),name=document.getElementById("orderName").value.trim(),phone=document.getElementById("orderPhone").value.trim(),city=document.getElementById("orderCity").value,address=document.getElementById("orderAddress").value.trim(),comment=document.getElementById("orderComment").value.trim();if(!phone)return toast("Вкажіть номер телефону");if(!city)return toast("Оберіть населений пункт");if(city==="__none__")return toast("Цей населений пункт поки недоступний");if(!address)return toast("Вкажіть адресу доставки");const z=delivery.find(d=>d.city===city),dp=Number(z?.delivery_price||0),pp=Number(p.price);try{await api("orders",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({customer_name:name||"Покупець",customer_phone:phone,city,address,delivery_price:dp,products_total:pp,total_price:pp+dp,items:[{product_id:p.id,name:p.name,price:pp,quantity:1}],comment,status:"new"})});closeModal();toast("Замовлення прийнято")}catch(e){console.error(e);toast("Не вдалося створити замовлення")}}

const ADMIN_LOGIN="EINSTEIN",ADMIN_PASSWORD="zax228xx";
function openAdminLogin(){document.getElementById("modalBox").innerHTML=`<h2>Вхід в адмін-панель</h2><label>Логін</label><input id="adminLogin"><label>Пароль</label><input id="adminPassword" type="password"><div class="modal-actions"><button class="blue" onclick="adminLogin()">Увійти</button><button class="white" onclick="closeModal()">Скасувати</button></div>`;document.getElementById("modal").classList.add("show")}
function adminLogin(){if(document.getElementById("adminLogin").value===ADMIN_LOGIN&&document.getElementById("adminPassword").value===ADMIN_PASSWORD){closeModal();document.getElementById("shop").style.display="none";document.getElementById("header").style.display="none";document.getElementById("admin").style.display="block";adminProducts()}else toast("Невірний логін або пароль")}
function logout(){document.getElementById("admin").style.display="none";document.getElementById("header").style.display="block";document.getElementById("shop").style.display="block"}

function adminProducts(){document.getElementById("adminContent").innerHTML=`<div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Товари</h2><button class="blue" onclick="productForm()">+ Додати товар</button></div>${products.length?products.map(p=>`<div class="product-admin">${p.image_url?`<img src="${escapeHtml(p.image_url)}">`:"<div style='font-size:32px;text-align:center'>📦</div>"}<div><b>${escapeHtml(p.name)}</b><div>${Number(p.price).toLocaleString("uk-UA")} грн · ${p.available?"🟢 В наявності":"🔴 Немає"}</div></div><div class="admin-actions"><button class="white" onclick="productForm('${p.id}')">✏️</button><button class="white" onclick="deleteProduct('${p.id}')">🗑️</button></div></div>`).join(""):'<div class="empty">Товарів немає.</div>'}</div>`}
function productForm(id=null){const p=id?products.find(x=>x.id===id):{name:"",description:"",price:"",image_url:"",category:"",available:true};document.getElementById("modalBox").innerHTML=`<h2>${id?"Редагувати товар":"Новий товар"}</h2><label>Назва товару *</label><input id="pName" value="${escapeHtml(p.name)}"><label>Категорія</label><input id="pCategory" value="${escapeHtml(p.category||"")}"><label>Ціна, грн *</label><input id="pPrice" type="number" value="${p.price}"><label>Фото товару</label>
<input id="pImage" type="file" accept="image/*">
${p.image_url?`<div style="margin-top:8px;font-size:13px;color:#68727c">Поточне фото збережено. Якщо виберете нове — воно буде замінене.</div>`:""}<label>Опис</label><textarea id="pDescription">${escapeHtml(p.description||"")}</textarea><label><input id="pAvailable" type="checkbox" ${p.available?"checked":""} style="width:auto"> В наявності</label><div class="modal-actions"><button class="blue" onclick="saveProduct('${id||""}')">Зберегти</button><button class="white" onclick="closeModal()">Скасувати</button></div>`;document.getElementById("modal").classList.add("show")}
async function uploadProductImage(file){
 if(!file)return null;
 if(!file.type.startsWith("image/"))throw new Error("Оберіть саме зображення");
 if(file.size>8*1024*1024)throw new Error("Фото має бути не більше 8 МБ");
 const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
 const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
 const r=await fetch(SUPABASE_URL+"/storage/v1/object/product-images/"+path,{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":file.type||"image/jpeg","x-upsert":"true"},body:file});
 if(!r.ok)throw new Error(await r.text()||"Не вдалося завантажити фото");
 return SUPABASE_URL+"/storage/v1/object/public/product-images/"+path;
}
async function saveProduct(id){
 const oldProduct=id?products.find(x=>x.id===id):null;
 const d={name:document.getElementById("pName").value.trim(),category:document.getElementById("pCategory").value.trim(),price:Number(document.getElementById("pPrice").value),image_url:oldProduct?.image_url||"",description:document.getElementById("pDescription").value.trim(),available:document.getElementById("pAvailable").checked};
 if(!d.name||!d.price)return toast("Заповніть назву та ціну");
 try{
  const file=document.getElementById("pImage").files[0];
  if(file)d.image_url=await uploadProductImage(file);
  await api(id?"products?id=eq."+id:"products",{method:id?"PATCH":"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify(d)});
  closeModal();await loadProducts();adminProducts();toast("Товар збережено");
 }catch(e){console.error(e);toast(e.message||"Помилка збереження")}
}
async function deleteProduct(id){if(!confirm("Видалити цей товар?"))return;try{await api("products?id=eq."+id,{method:"DELETE"});await loadProducts();adminProducts();toast("Товар видалено")}catch(e){toast("Помилка видалення")}}

async function adminOrders(){try{const orders=await api("orders?select=*&order=created_at.desc");document.getElementById("adminContent").innerHTML=`<div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Замовлення</h2><button class="white" onclick="adminOrders()">Оновити</button></div>${orders.length?orders.map(o=>{let items=[];try{items=Array.isArray(o.items)?o.items:JSON.parse(o.items||"[]")}catch(e){}return `<div class="admin-card"><div class="order-top"><div><b>Замовлення №${escapeHtml(o.order_number||o.id)}</b><div class="small">${o.created_at?new Date(o.created_at).toLocaleString("uk-UA"):""}</div></div><span class="status ${escapeHtml(o.status||"new")}">${statusText(o.status)}</span></div><hr><p>👤 <b>${escapeHtml(o.customer_name||"Покупець")}</b></p><p>📞 ${escapeHtml(o.customer_phone||"")}</p><p>📍 ${escapeHtml(o.city||"")}, ${escapeHtml(o.address||"")}</p><p>🛒 ${items.length?items.map(i=>`${escapeHtml(i.name)} × ${i.quantity||1} — ${Number(i.price||0).toLocaleString("uk-UA")} грн`).join("<br>"):"Товар не вказаний"}</p>${o.comment?`<p>💬 ${escapeHtml(o.comment)}</p>`:""}<p>🚚 Доставка: ${Number(o.delivery_price||0).toLocaleString("uk-UA")} грн</p><div class="order-total">💰 Разом: ${Number(o.total_price||0).toLocaleString("uk-UA")} грн</div><div class="admin-actions"><button class="blue" onclick="changeOrderStatus('${o.id}','confirmed')">Підтвердити</button><button class="white" onclick="changeOrderStatus('${o.id}','done')">Виконано</button><button class="white" onclick="changeOrderStatus('${o.id}','cancelled')">Скасувати</button><button class="red" onclick="deleteOrder('${o.id}')">Видалити</button></div></div>`}).join(""):'<div class="empty">Замовлень поки немає.</div>'}</div>`}catch(e){console.error(e);toast("Не вдалося завантажити замовлення")}}
function statusText(s){return s==="confirmed"?"Підтверджено":s==="done"?"Виконано":s==="cancelled"?"Скасовано":"Нове"}
async function changeOrderStatus(id,s){try{await api("orders?id=eq."+id,{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({status:s})});adminOrders()}catch(e){toast("Помилка зміни статусу")}}
async function deleteOrder(id){if(!confirm("Видалити це замовлення?"))return;try{await api("orders?id=eq."+id,{method:"DELETE"});adminOrders();toast("Замовлення видалено")}catch(e){toast("Помилка видалення")}}

function adminDelivery(){document.getElementById("adminContent").innerHTML=`<div class="box"><h2>🚚 Доставка</h2><p class="small">Покупець вибирає населений пункт зі списку.</p>${delivery.map(d=>`<div class="admin-card"><b>${escapeHtml(d.city)}</b><span style="float:right">${Number(d.delivery_price).toLocaleString("uk-UA")} грн</span><div class="admin-actions"><button class="white" onclick="deleteDelivery('${d.id}')">🗑️ Видалити</button></div></div>`).join("")}<h3>Додати населений пункт</h3><label>Назва</label><input id="newCity"><label>Ціна доставки, грн</label><input id="newDeliveryPrice" type="number"><div class="admin-actions"><button class="blue" onclick="addDelivery()">Додати</button></div></div>`}
async function addDelivery(){const city=document.getElementById("newCity").value.trim(),price=Number(document.getElementById("newDeliveryPrice").value);if(!city||!price)return toast("Заповніть дані");try{await api("delivery_zones",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({city,delivery_price:price,active:true})});delivery=await api("delivery_zones?select=*&active=eq.true&order=city.asc");adminDelivery();toast("Населений пункт додано")}catch(e){toast("Помилка")}}
async function deleteDelivery(id){if(!confirm("Видалити населений пункт?"))return;try{await api("delivery_zones?id=eq."+id,{method:"DELETE"});delivery=await api("delivery_zones?select=*&active=eq.true&order=city.asc");adminDelivery()}catch(e){toast("Помилка")}}

function adminSettings(){if(!settings)return;document.getElementById("adminContent").innerHTML=`<div class="box"><h2>⚙️ Магазин</h2><div class="settings-grid"><div><label>Назва магазину</label><input id="setName" value="${escapeHtml(settings.store_name||"")}"></div><div><label>Телефон</label><input id="setPhone" value="${escapeHtml(settings.phone||"")}"></div><div><label>Instagram</label><input id="setInstagram" value="${escapeHtml(settings.instagram||"")}"></div><div><label>Адреса</label><input id="setAddress" value="${escapeHtml(settings.address||"")}"></div></div><label>Опис</label><textarea id="setDescription">${escapeHtml(settings.description||"")}</textarea><div class="admin-actions"><button class="blue" onclick="saveSettings()">Зберегти</button></div></div>`}
async function saveSettings(){const d={store_name:document.getElementById("setName").value.trim(),phone:document.getElementById("setPhone").value.trim(),instagram:document.getElementById("setInstagram").value.trim().replace(/^@/,""),address:document.getElementById("setAddress").value.trim(),description:document.getElementById("setDescription").value.trim()};try{await api("store_settings?id=eq.1",{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify(d)});settings={...settings,...d};applySettings();toast("Налаштування збережено")}catch(e){toast("Помилка")}}
async function loadProducts(){products=await api("products?select=*&order=name.asc");renderCategories();renderProducts()}
function closeModal(){document.getElementById("modal").classList.remove("show")}function callShop(){location.href="tel:"+(settings?.phone||"+380985553449")}function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2500)}function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target===document.getElementById("modal"))closeModal()});
loadEverything();
</script>
